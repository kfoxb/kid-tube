name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # refresh the video list every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Playlists are cached between runs to save YouTube API quota.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: youtube-${{ github.run_id }}
          restore-keys: youtube-
      - name: Fetch allowed videos
        run: node scripts/fetch-videos.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
